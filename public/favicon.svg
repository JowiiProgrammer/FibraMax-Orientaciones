<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Glow rojo Fibra -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradiente sutil en background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Reflejo rojo sutil en esquina superior izquierda -->
  <circle cx="4" cy="4" r="10" fill="#DF3E6F" opacity="0.08"/>

  <!-- ── Dumbbell ── -->
  <!-- Placa izquierda -->
  <rect x="1"  y="8" width="7" height="16" rx="2.5" fill="#DF3E6F" filter="url(#glow)"/>
  <!-- Collar izquierdo -->
  <rect x="8"  y="12" width="3" height="8"  rx="1"   fill="#DF3E6F"/>
  <!-- Barra central -->
  <rect x="11" y="13.5" width="10" height="5" rx="2.5" fill="#DF3E6F"/>
  <!-- Collar derecho -->
  <rect x="21" y="12" width="3" height="8"  rx="1"   fill="#DF3E6F"/>
  <!-- Placa derecha -->
  <rect x="24" y="8" width="7" height="16" rx="2.5" fill="#DF3E6F" filter="url(#glow)"/>

  <!-- Brillo en las placas (highlight superior) -->
  <rect x="1.5"  y="8.5"  width="6" height="3" rx="1.5" fill="white" opacity="0.12"/>
  <rect x="24.5" y="8.5"  width="6" height="3" rx="1.5" fill="white" opacity="0.12"/>
</svg>
